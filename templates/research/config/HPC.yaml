# scitex-hpc. Host, account and partition are given on the make command line
# (they are per-user); the resources below are per-project.
STEP: scripts/mnist/02_train_classifiers.py
CPUS: 4
MEM: 8G
TIME: "00:30:00"
JOB_NAME: mnist-train
