# Analysis parameters of the MNIST showcase. Every number that shapes a
# result lives here (scitex-dev STX-S008); scripts read CONFIG.MNIST.<KEY>.
# Each run freezes the values it used in <script>_out/.../CONFIGS/CONFIG.yaml.

DATASET: mnist            # scitex-dataset reference id (checksummed download)

# Training subset drawn from the 60,000 official training images. Kept small
# so `make all` finishes in about a minute on a laptop CPU. The full
# 10,000-image official test set is always used for evaluation.
N_TRAIN: 5000
SPLIT_SEED: 42            # seeds the training-subset draw
PIXEL_SCALE: 255          # uint8 pixels -> [0, 1]

# Classifiers built by scitex_ml.Classifier (scikit-learn under the hood),
# with these hyper-parameters set on top of the factory defaults.
CLASSIFIERS:
  LOGREG:
    NAME: LogisticRegression
    PARAMS:
      max_iter: 1000
  SVC:
    NAME: SVC
    PARAMS:
      kernel: rbf
      C: 10.0
      gamma: scale
CLASSIFIER_SEED: 42
